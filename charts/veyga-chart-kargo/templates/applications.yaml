{{- if .Values.argocd.createApplications }}
{{- range $stage := .Values.stages }}
{{- $app := include "veygaKargo.appName" (dict "stage" $stage "context" $) }}
---
# Deploys the manifests Kargo renders into gitops {{ include "veygaKargo.gitopsPath" (dict "stage" $stage "context" $) }}/; Kargo syncs it on promotion
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $app }}
  namespace: {{ $.Values.argocd.namespace }}
  labels:
    {{- include "veygaKargo.labels" $ | nindent 4 }}
  annotations:
    {{- include "veygaKargo.wave" 1 | nindent 4 }}
    # lets this Kargo stage (and only it) update and sync the Application
    kargo.akuity.io/authorized-stage: {{ printf "%s:%s" (include "veygaKargo.project" $) $stage.name | quote }}
spec:
  project: {{ $.Values.argocd.project }}
  source:
    repoURL: {{ $.Values.gitops.repoURL }}
    targetRevision: {{ $.Values.gitops.branch }}
    path: {{ include "veygaKargo.gitopsPath" (dict "stage" $stage "context" $) }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ include "veygaKargo.namespace" (dict "stage" $stage "context" $) }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
{{- end }}
