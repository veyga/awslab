# exampleapp's Kargo pipeline, from its own repo (deploy/kargo, which depends on the
# veyga-kargo chart): the Kargo Project, Warehouses and Stages, plus the per-stage
# Applications that deploy dev/exampleapp and prod/exampleapp from veygawslab/gitops. Kargo
# renders those directories on promotion.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: exampleapp-kargo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/veygawslab/exampleapp.git
    targetRevision: main
    path: deploy/kargo
    helm:
      releaseName: exampleapp-kargo
  destination:
    server: https://kubernetes.default.svc
    namespace: kargo-exampleapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # the Project creates its namespace asynchronously, so the first sync of the
    # namespaced resources can race it
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
