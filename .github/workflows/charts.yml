# Helm charts under charts/<dir>/ are published to ECR as OCI artifacts:
#   oci://<ecr>/veyga/charts/<Chart.yaml name>:<Chart.yaml version>
#
#   pull request       -> require every changed chart's version to be bumped
#   push to main / run -> push every chart whose Chart.yaml version isn't in ECR yet
#
# Publishing is driven by the registry, not the diff: unchanged charts are already
# published and skipped, and a chart whose run failed is picked up by the next one.
#
# Each chart needs its ECR repo first: contexts/hub/ecr/charts/<Chart.yaml name>.
# Runs on our ARC runners (helm comes from our runner image); ECR access is the runner
# pod's Pod Identity.
name: charts

on:
  push:
    branches: [main]
    paths:
      - charts/**
      - .github/workflows/charts.yml
  pull_request:
    paths:
      - charts/**
      - .github/workflows/charts.yml
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CHART_REPO_PREFIX: veyga/charts

concurrency:
  group: charts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  charts:
    # the runner pod has ECR push rights: never run fork PRs on it
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: veygawslab-runner
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the diff against the base commit needs history

      # charts/<dir> with a Chart.yaml that had any file change between base and head.
      # Deleted charts drop out (no Chart.yaml at head).
      - name: find changed charts
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          all_charts() { find charts -mindepth 2 -maxdepth 2 -name Chart.yaml -exec dirname {} \; | sort; }

          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac

          # manual run, new branch (before = 000...) or a base no longer in history: everything
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            charts=$(all_charts)
          else
            charts=$(git diff --name-only "$base" HEAD -- charts \
              | cut -d/ -f1-2 | sort -u \
              | while read -r d; do [ -f "$d/Chart.yaml" ] && echo "$d"; done)
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "charts=$(echo $charts)" >> "$GITHUB_OUTPUT"
          echo "changed charts: ${charts:-none}"

      # a changed chart must carry a new, higher version or main can't publish it
      - name: require version bump
        if: github.event_name == 'pull_request' && steps.changed.outputs.charts != ''
        env:
          BASE: ${{ steps.changed.outputs.base }}
        run: |
          version() { grep -E '^version:' | head -1 | awk '{print $2}' | tr -d "\"'"; }
          failed=0
          for c in ${{ steps.changed.outputs.charts }}; do
            new=$(version < "$c/Chart.yaml")
            if ! old=$(git show "$BASE:$c/Chart.yaml" 2>/dev/null | version) || [ -z "$old" ]; then
              echo "$c: new chart at $new"
              continue
            fi
            highest=$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)
            if [ "$new" = "$old" ] || [ "$highest" != "$new" ]; then
              echo "::error file=$c/Chart.yaml::$c changed but its version is $new (main has $old); bump version in Chart.yaml"
              failed=1
            else
              echo "$c: $old -> $new"
            fi
          done
          exit $failed

      # credentials come from the pod (Pod Identity); helm reads the docker login
      - name: ecr login
        if: github.event_name != 'pull_request'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: publish
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          CHANGED: ${{ steps.changed.outputs.charts }}
        run: |
          mkdir -p .packaged
          for c in $(find charts -mindepth 2 -maxdepth 2 -name Chart.yaml -exec dirname {} \; | sort); do
            name=$(helm show chart "$c" | grep -E '^name:' | awk '{print $2}')
            version=$(helm show chart "$c" | grep -E '^version:' | awk '{print $2}' | tr -d "\"'")
            ref="oci://$REGISTRY/$CHART_REPO_PREFIX/$name"

            # versions are immutable in ECR: an existing one is left alone. Only worth
            # a warning when the chart changed in this push (a forgotten version bump).
            if helm show chart "$ref" --version "$version" >/dev/null 2>&1; then
              if [[ " $CHANGED " == *" $c "* ]]; then
                echo "::warning file=$c/Chart.yaml::$name $version is already published; bump the version to publish changes"
              else
                echo "$name $version: already published"
              fi
              continue
            fi

            helm package "$c" --destination .packaged
            helm push ".packaged/$name-$version.tgz" "oci://$REGISTRY/$CHART_REPO_PREFIX"
            echo "- \`$ref\` \`$version\`" >> "$GITHUB_STEP_SUMMARY"
          done
