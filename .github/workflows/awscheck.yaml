name: awscheck

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: awscheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: veygawslab-runner
    timeout-minutes: 10
    # needs the scale set in dind mode; the container is started by the dind sidecar
    container:
      image: amazon/aws-cli:2.39.4
      # Pod Identity credentials: the EKS webhook gives every container in the runner pod
      # (dind included) this env + token mount, but a job container has to be handed them
      env:
        AWS_REGION: us-east-1
        AWS_CONTAINER_CREDENTIALS_FULL_URI: http://169.254.170.23/v1/credentials
        AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE: /var/run/secrets/pods.eks.amazonaws.com/serviceaccount/eks-pod-identity-token
      volumes:
        - /var/run/secrets/pods.eks.amazonaws.com/serviceaccount:/var/run/secrets/pods.eks.amazonaws.com/serviceaccount:ro
    steps:
      - name: whoami
        run: aws sts get-caller-identity

      - name: sleep
        run: sleep 120
