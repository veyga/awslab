#   pull request -> <ecr>/veyga/gharunner:<short head sha>  (immutable, for testing the PR)
#   push to main -> <ecr>/veyga/gharunner:latest             (the only mutable tag)
#
# Runs on our ARC runners (scale set in dind mode, for the docker daemon). AWS access is the
# runner pod's Pod Identity (service account gha-runner): no OIDC role, no credentials step.
name: runner-image

on:
  push:
    branches: [main]
    paths:
      - images/gha-runner/**
      - .github/workflows/runner-image.yml
  pull_request:
    paths:
      - images/gha-runner/**
      - .github/workflows/runner-image.yml
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: veyga/gharunner
  IMAGE_CONTEXT: images/gha-runner
  IMAGE_PLATFORMS: linux/amd64

# never cancel a push to latest midway; superseded PR builds can go
concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    # the runner pod has ECR push rights: never run fork PRs on it
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: veygawslab-runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # PRs build the merge commit, but are tagged with the PR head sha (what `git log` shows)
      - name: image tag
        id: tag
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      # credentials come from the pod (AWS_CONTAINER_CREDENTIALS_FULL_URI + token, set by EKS)
      - name: ecr login
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # sha tags are immutable: re-running for an already-pushed sha is a no-op, not a failure.
      # docker, not the aws cli: the stock runner image has no aws cli
      - name: check for existing tag
        if: steps.tag.outputs.tag != 'latest'
        id: exists
        run: |
          if docker manifest inspect \
              "${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "already pushed, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.exists.outputs.exists != 'true'

      - name: build and push
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.IMAGE_CONTEXT }}
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          # no attestations: push one plain manifest instead of an index whose untagged
          # children ECR lists (and the untagged lifecycle rule could expire)
          provenance: false
          sbom: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: summary
        run: |
          echo "image: \`${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
