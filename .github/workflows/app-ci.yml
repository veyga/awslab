# Reusable CI for app repos: PRs build + test an image, merges to main release it.
#
#   pull request -> build the image, run `test-command` inside it, push
#                   <ecr>/<image>:<sha7> (sha of the PR head)
#   push to main -> find the merged PR, point <ecr>/<image>:<version> at that PR's tested
#                   image (no rebuild), then create the v<version> git tag + GitHub release
#
# Versions are CalVer, YYYY.M.N (UTC): N counts releases within the month, from 0
# (2026.11.0, 2026.11.1, 2026.12.0). No zero padding, so every version is also strict semver
# and sorts correctly (Kargo's SemVer Warehouses rely on that).
#
# Caller (in the app repo):
#
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   permissions:
#     contents: write       # tag + release
#     pull-requests: read   # find the PR a merge came from
#   jobs:
#     ci:
#       uses: veygawslab/awslab/.github/workflows/app-ci.yml@main
#       with:
#         image: veyga/exampleapp
#         test-command: pytest -v
#
# Runs on our ARC runners; ECR access is the runner pod's Pod Identity.
name: app-ci

on:
  workflow_call:
    inputs:
      image:
        description: "ECR repository, e.g. veyga/exampleapp (must exist: contexts/hub/ecr/<name>)"
        type: string
        required: true
      test-command:
        description: "shell command run inside the built image (`sh -c`); empty = no tests"
        type: string
        default: ""
      context:
        description: "docker build context"
        type: string
        default: .
      dockerfile:
        description: "Dockerfile path, relative to the repo root"
        type: string
        default: Dockerfile
      platforms:
        description: "platforms to build (the runners and cluster nodes are amd64)"
        type: string
        default: linux/amd64
      runs-on:
        description: "runner label"
        type: string
        default: veygawslab-runner
    outputs:
      image-tag:
        description: "the tag pushed (<sha7> on PRs, YYYY.M.N on releases; empty if none)"
        value: ${{ jobs.build.outputs.tag || jobs.release.outputs.version }}

env:
  AWS_REGION: us-east-1

jobs:
  build:
    # fork PRs must never run on our runners (they hold ECR push rights)
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # tagged with the PR head sha, so the release can find this exact image after the merge
      - name: image tag
        id: tag
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "tag=${SHA::7}" >> "$GITHUB_OUTPUT"

      - name: ecr login
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: image ref
        id: ref
        run: echo "ref=${{ steps.ecr.outputs.registry }}/${{ inputs.image }}:${{ steps.tag.outputs.tag }}" >> "$GITHUB_OUTPUT"

      # tags are immutable: a re-run for an already pushed (so already tested) sha is a no-op
      - name: check for existing tag
        id: exists
        run: |
          if docker manifest inspect "${{ steps.ref.outputs.ref }}" >/dev/null 2>&1; then
            echo "::notice::${{ steps.ref.outputs.ref }} already pushed, skipping build"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.exists.outputs.exists != 'true'

      # load into the local daemon first: only a tested image gets pushed
      - name: build
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          load: true
          provenance: false
          sbom: false
          build-args: APP_VERSION=${{ steps.tag.outputs.tag }}
          tags: ${{ steps.ref.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: test
        if: steps.exists.outputs.exists != 'true' && inputs.test-command != ''
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: docker run --rm --entrypoint sh "${{ steps.ref.outputs.ref }}" -c "$TEST_COMMAND"

      - name: push
        if: steps.exists.outputs.exists != 'true'
        run: docker push "${{ steps.ref.outputs.ref }}"

      - name: summary
        run: |
          echo "image: \`${{ steps.ref.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    # one release at a time per repo: two merges must not compute the same version
    concurrency:
      group: app-ci-release-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      API: ${{ github.api_url }}/repos/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags + history since the last release

      # the image to release is the one built and tested for the merged PR's head commit
      - name: find merged PR
        id: pr
        run: |
          pr=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/commits/$GITHUB_SHA/pulls" \
            | jq -c '[.[] | select(.merged_at != null and .base.ref == "${{ github.event.repository.default_branch }}")][0] // empty')
          if [ -z "$pr" ]; then
            echo "::notice::$GITHUB_SHA didn't come from a merged PR (direct push?); nothing to release"
            exit 0
          fi
          echo "number=$(jq -r .number <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r .head.sha <<<"$pr" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: next version
        if: steps.pr.outputs.head != ''
        id: version
        run: |
          month=$(date -u +%Y.%-m)
          last=$(git tag -l "v$month.*" | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$last" ]; then
            version="$month.0"
          else
            version="$month.$(( ${last##*.} + 1 ))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "${last:-none this month} -> $version"

      - name: ecr login
        if: steps.pr.outputs.head != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # registry-side copy of the tested image: the release is byte-for-byte what was tested
      - name: tag image
        if: steps.pr.outputs.head != ''
        env:
          SOURCE: ${{ steps.ecr.outputs.registry }}/${{ inputs.image }}:${{ steps.pr.outputs.head }}
          TARGET: ${{ steps.ecr.outputs.registry }}/${{ inputs.image }}:${{ steps.version.outputs.version }}
        run: |
          if ! docker manifest inspect "$SOURCE" >/dev/null 2>&1; then
            echo "::error::$SOURCE not found: the PR's build must succeed before its merge can be released"
            exit 1
          fi
          # a re-run after a failed release step: the version tag already points at this image
          if docker manifest inspect "$TARGET" >/dev/null 2>&1; then
            echo "::notice::$TARGET already exists"
          else
            docker buildx imagetools create --tag "$TARGET" "$SOURCE"
          fi

      - name: github release
        if: steps.pr.outputs.head != ''
        env:
          VERSION: v${{ steps.version.outputs.version }}
        run: |
          jq -n --arg tag "$VERSION" --arg sha "$GITHUB_SHA" \
            '{tag_name: $tag, target_commitish: $sha, name: $tag, generate_release_notes: true}' \
          | curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/releases" -d @- | jq -r '.html_url'

      - name: summary
        if: steps.pr.outputs.head != ''
        run: |
          echo "release: \`v${{ steps.version.outputs.version }}\` (PR #${{ steps.pr.outputs.number }})" >> "$GITHUB_STEP_SUMMARY"
          echo "image: \`${{ steps.ecr.outputs.registry }}/${{ inputs.image }}:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
