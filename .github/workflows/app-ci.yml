# Reusable CI for app repos: PRs build + test an image, merges to main release it.
#
#   pull request -> build:   build the image (layers cached in the GitHub Actions cache) and
#                            push it as a candidate, <ecr>/<image>-ci:<sha7> (PR head sha)
#                   test:    pull the candidate, run `test-command` inside it
#                   publish: once the tests pass, copy the candidate to <ecr>/<image>:<sha7>
#                   pr-tag:  tag the PR head commit kargo-pr<N>-<sha7>: Kargo's dev Warehouse
#                            pairs that image with that commit (its deploy/), so a PR's config
#                            reaches dev together with its code
#   push to main -> release: find the merged PR, point <ecr>/<image>:<version> at the image
#                            published for it, then create the v<version> git tag + release
#
# Every copy is a registry-side `skopeo copy` (no rebuild, same digest; skopeo is in the
# runner image): the released image is byte-for-byte the one that was tested, so the image has
# to carry its test tooling (e.g. the dev dependency group) and tests. Candidates live in their
# own repository, <image>-ci, whose images expire after a few days
# (contexts/hub/ecr/<name>: ci_repository.enabled = true).
#
# Versions are CalVer, YYYY.M.N (UTC): N counts releases within the month, from 0
# (2026.11.0, 2026.11.1, 2026.12.0). No zero padding, so every version is also strict semver
# and sorts correctly (Kargo's SemVer Warehouses rely on that).
#
# Caller (in the app repo):
#
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   permissions:
#     contents: write       # kargo-pr tags, release tag + GitHub release
#     pull-requests: read   # find the PR a merge came from
#   jobs:
#     ci:
#       uses: veygawslab/awslab/.github/workflows/app-ci.yml@main
#       with:
#         image: veyga/exampleapp
#         test-command: just test
#
# Runs on our ARC runners (images/gha-runner: uv, python, docker, aws, helm, ...); ECR access is
# the runner pod's Pod Identity.
name: app-ci

on:
  workflow_call:
    inputs:
      image:
        description: "ECR repository, e.g. veyga/exampleapp (must exist: contexts/hub/ecr/<name>)"
        type: string
        required: true
      test-command:
        description: "test command run (`sh -c`) inside the built image, e.g. `just test` or `pytest`; empty = no tests"
        type: string
        default: ""
      context:
        description: "docker build context"
        type: string
        default: .
      dockerfile:
        description: "Dockerfile path, relative to the repo root"
        type: string
        default: Dockerfile
      platforms:
        description: "platforms to build (the runners and cluster nodes are amd64)"
        type: string
        default: linux/amd64
      runs-on:
        description: "runner label"
        type: string
        default: veygawslab-runner
    outputs:
      image-tag:
        description: "the tag pushed (<sha7> on PRs, YYYY.M.N on releases; empty if none)"
        value: ${{ jobs.build.outputs.tag || jobs.release.outputs.version }}

env:
  AWS_REGION: us-east-1

jobs:
  build:
    # fork PRs must never run on our runners (they hold ECR push rights)
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    # only the tag crosses jobs: an output with the registry (it holds the account id) can be
    # dropped as a possible secret, so each job derives its refs from its own ecr login
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      published: ${{ steps.exists.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      - name: ecr login
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # tagged with the PR head sha, so the release can find this exact image after the merge
      - name: image refs
        id: ref
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ steps.ecr.outputs.registry }}/${{ inputs.image }}
        run: |
          echo "tag=${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "candidate=$REPO-ci:${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=$REPO:${SHA::7}" >> "$GITHUB_OUTPUT"

      # tags are immutable: a re-run for an already published sha is a no-op, and one whose
      # candidate exists (e.g. after a failed test) reuses it
      - name: check for existing images
        id: exists
        run: |
          if docker manifest inspect "${{ steps.ref.outputs.image }}" >/dev/null 2>&1; then
            echo "::notice::${{ steps.ref.outputs.image }} already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "${{ steps.ref.outputs.candidate }}" >/dev/null 2>&1; then
            echo "::notice::${{ steps.ref.outputs.candidate }} already built"
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.exists.outputs.published != 'true' && steps.exists.outputs.built != 'true'

      - name: build and push candidate
        if: steps.exists.outputs.published != 'true' && steps.exists.outputs.built != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          provenance: false
          sbom: false
          build-args: APP_VERSION=${{ steps.ref.outputs.tag }}
          tags: ${{ steps.ref.outputs.candidate }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    needs: build
    if: needs.build.outputs.published != 'true' && inputs.test-command != ''
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    env:
      CANDIDATE: ${{ inputs.image }}-ci:${{ needs.build.outputs.tag }}
    steps:
      - name: ecr login
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: pull candidate
        run: docker pull --quiet "${{ steps.ecr.outputs.registry }}/$CANDIDATE"

      - name: test
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: docker run --rm --entrypoint sh "${{ steps.ecr.outputs.registry }}/$CANDIDATE" -c "$TEST_COMMAND"

  publish:
    # only after the tests pass (or when there are none: test is then skipped)
    needs: [build, test]
    if: >-
      always()
      && needs.build.result == 'success'
      && needs.build.outputs.published != 'true'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    env:
      CANDIDATE: ${{ inputs.image }}-ci:${{ needs.build.outputs.tag }}
      IMAGE: ${{ inputs.image }}:${{ needs.build.outputs.tag }}
    steps:
      - name: ecr login
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # registry-side copy: the published image is byte-for-byte the tested candidate
      # (--preserve-digests fails rather than ever write a different digest). skopeo reads the
      # docker login from ecr login
      - name: publish
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: skopeo copy --preserve-digests --all "docker://$REGISTRY/$CANDIDATE" "docker://$REGISTRY/$IMAGE"

      - name: summary
        run: |
          echo "image: \`${{ steps.ecr.outputs.registry }}/$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  # after the image exists (just published, or by an earlier run): the tag is what makes
  # Kargo pick the pair up, so it must never point at a commit without an image
  pr-tag:
    needs: [build, publish]
    if: >-
      always()
      && needs.build.result == 'success'
      && (needs.publish.result == 'success' || needs.build.outputs.published == 'true')
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      API: ${{ github.api_url }}/repos/${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha }}
      TAG: kargo-pr${{ github.event.pull_request.number }}-${{ needs.build.outputs.tag }}
    steps:
      - name: tag PR head
        run: |
          existing=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/git/ref/tags/$TAG" | jq -r '.object.sha // empty')
          if [ "$existing" = "$SHA" ]; then
            echo "$TAG already points at $SHA"
            exit 0
          elif [ -n "$existing" ]; then
            echo "::error::$TAG already exists on $existing, not $SHA"
            exit 1
          fi
          jq -n --arg ref "refs/tags/$TAG" --arg sha "$SHA" '{ref: $ref, sha: $sha}' \
          | curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/git/refs" -d @- >/dev/null
          echo "tagged $SHA as $TAG" | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    # one release at a time per repo: two merges must not compute the same version
    concurrency:
      group: app-ci-release-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      API: ${{ github.api_url }}/repos/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags + history since the last release

      # the image to release is the one published (built + tested) for the merged PR's head
      - name: find merged PR
        id: pr
        run: |
          pr=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/commits/$GITHUB_SHA/pulls" \
            | jq -c '[.[] | select(.merged_at != null and .base.ref == "${{ github.event.repository.default_branch }}")][0] // empty')
          if [ -z "$pr" ]; then
            echo "::notice::$GITHUB_SHA didn't come from a merged PR (direct push?); nothing to release"
            exit 0
          fi
          echo "number=$(jq -r .number <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r .head.sha <<<"$pr" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: next version
        if: steps.pr.outputs.head != ''
        id: version
        run: |
          month=$(date -u +%Y.%-m)
          last=$(git tag -l "v$month.*" | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$last" ]; then
            version="$month.0"
          else
            version="$month.$(( ${last##*.} + 1 ))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "${last:-none this month} -> $version"

      - name: ecr login
        if: steps.pr.outputs.head != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # registry-side copy: the release is byte-for-byte the image the PR tested
      - name: tag image
        if: steps.pr.outputs.head != ''
        env:
          SOURCE: ${{ steps.ecr.outputs.registry }}/${{ inputs.image }}:${{ steps.pr.outputs.head }}
          TARGET: ${{ steps.ecr.outputs.registry }}/${{ inputs.image }}:${{ steps.version.outputs.version }}
        run: |
          if ! docker manifest inspect "$SOURCE" >/dev/null 2>&1; then
            echo "::error::$SOURCE not found: the PR's build must succeed before its merge can be released"
            exit 1
          fi
          # a re-run after a failed release step: the version tag already points at this image
          if docker manifest inspect "$TARGET" >/dev/null 2>&1; then
            echo "::notice::$TARGET already exists"
          else
            skopeo copy --preserve-digests --all "docker://$SOURCE" "docker://$TARGET"
          fi

      - name: github release
        if: steps.pr.outputs.head != ''
        env:
          VERSION: v${{ steps.version.outputs.version }}
        run: |
          jq -n --arg tag "$VERSION" --arg sha "$GITHUB_SHA" \
            '{tag_name: $tag, target_commitish: $sha, name: $tag, generate_release_notes: true}' \
          | curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/releases" -d @- | jq -r '.html_url'

      - name: summary
        if: steps.pr.outputs.head != ''
        run: |
          echo "release: \`v${{ steps.version.outputs.version }}\` (PR #${{ steps.pr.outputs.number }})" >> "$GITHUB_STEP_SUMMARY"
          echo "image: \`${{ steps.ecr.outputs.registry }}/${{ inputs.image }}:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
